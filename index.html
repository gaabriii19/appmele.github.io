<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liga de Petanca Invernal del CDPT</title>
<style>
:root{--bg:#f7f5ee;--card:#fffefb;--ink:#37362f;--mute:#6b6a58;--line:#e2dfcc;--acc:#6b7a3a;--accsoft:#e6ecd2;--gold:#a24c5e;--bad:#b04a5a;
--f:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f211a;--card:#2a2d23;--ink:#efecde;--mute:#aaa892;--line:#44473a;--acc:#b5c57c;--accsoft:#3a4129;--gold:#e29aa7;--bad:#e68a96;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f211a;--card:#2a2d23;--ink:#efecde;--mute:#aaa892;--line:#44473a;--acc:#b5c57c;--accsoft:#3a4129;--gold:#e29aa7;--bad:#e68a96;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
h1,h2,h3,button,input,select,th,.tab{font-family:var(--f)}
header{display:flex;align-items:center;gap:14px;max-width:956px;width:calc(100% - 24px);margin:14px auto 0;padding:12px 16px;background:var(--accsoft);border-bottom:4px solid var(--gold);border-radius:14px}.logo{width:64px;height:64px;object-fit:contain;flex:none}
h1{margin:0;font-size:1.2rem;line-height:1.25;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--mute);font-size:.95rem}
nav{display:flex;gap:6px;max-width:980px;margin:12px auto 0;padding:0 16px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:16px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:640px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.78rem;color:var(--ink);background:var(--accsoft);font-weight:600}
td.t,th.t{text-align:left}
tr:last-child td{border-bottom:0}
td.pos{font-weight:700;width:36px}
tr.top td.pos{color:var(--gold)}
td.pts{font-weight:700;color:var(--acc)}
.neg{color:var(--bad)}
.note{color:var(--mute);font-size:.85rem;margin:10px 2px}
.jbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.jbar button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:700}
.jbar button[aria-pressed="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.jbar button.done{border-color:var(--acc)}
.match{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.mh{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-family:var(--f);font-size:.92rem;margin-bottom:8px}
.mh span:last-child{text-align:right}
.mh .w{color:var(--acc);font-weight:700}
.mh .vs{color:var(--mute);font-size:.8rem}
.row{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin:4px 0}
.row b{color:var(--mute);font-size:.8rem;font-family:var(--f)}
input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem;text-align:center}
input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.res{margin-top:8px;font-size:.88rem;color:var(--mute);font-family:var(--f)}
.res.ok{color:var(--acc);font-weight:600}
.teams{display:grid;gap:8px}
.teams label{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;font-family:var(--f);font-size:.9rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer;font-size:.92rem}
.btn.alt{background:transparent;color:var(--acc)}
.btn.dng{background:transparent;color:var(--bad);border-color:var(--bad)}
.h2{margin:4px 0 8px;font-size:1.1rem}
.sub{margin:0 0 6px;color:var(--mute);font-size:.88rem}
.tab.g[aria-selected="true"]{background:var(--gold);border-color:var(--gold)}
</style>
</head>

  [1,2,3].forEach(function(g){var t={};for(var i=1;i<=10;i++)t[10*(g-1)+i]=TEAMS0[10*(g-1)+i];o.g[g]={teams:t,res:JSON.parse(JSON.stringify(SEEDS[g]))}});
  return o;
}
var ADMIN=location.hash==='#admin';
function RO(){return ADMIN?'':' readonly'}
function save(){if(ADMIN)try{localStorage.setItem(KEY,JSON.stringify(ALL))}catch(e){}}
function wrAll(){save()}
var ALL=load(),S,FIX,tab='clas',jsel=null;
function setGroup(g){ALL.cur=g;S=ALL.g[g];FIX=fixFor(g);jsel=null}
setGroup(ALL.cur||1);
function nm(id){return 'Equipo '+id+' · '+S.teams[id]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// Resultado de un enfrentamiento: null si no está completo
function outcome(j,i){
  var p=S.res[j+'-'+i];if(!p||p.length<3)return null;
  var a=0,b=0,fa=0,fb=0;
  for(var k=0;k<3;k++){
    var x=p[k][0],y=p[k][1];
    if(x===''||y===''||x==null||y==null)return null;
    x=+x;y=+y;fa+=x;fb+=y;if(x>y)a++;else if(y>x)b++;
  }
  return {a:a,b:b,fa:fa,fb:fb};
}
function standings(){
  var t={};Object.keys(S.teams).forEach(function(id){t[id]={id:+id,pj:0,pg:0,pp:0,gw:0,gl:0,pf:0,pc:0,pts:0}});
  FIX.forEach(function(J,j){J.forEach(function(m,i){
    var o=outcome(j,i);if(!o)return;var A=t[m[0]],B=t[m[1]];
    A.pj++;B.pj++;A.gw+=o.a;A.gl+=o.b;B.gw+=o.b;B.gl+=o.a;A.pf+=o.fa;A.pc+=o.fb;B.pf+=o.fb;B.pc+=o.fa;
    if(o.a>o.b){A.pg++;B.pp++;A.pts+=3}else if(o.b>o.a){B.pg++;A.pp++;B.pts+=3}
  })});
  return Object.keys(t).map(function(k){var x=t[k];x.cg=x.gw-x.gl;x.cp=x.pf-x.pc;return x})
   .sort(function(a,b){return b.pts-a.pts||b.cg-a.cg||b.cp-a.cp||a.id-b.id});
}
function sg(n){return n>0?'+'+n:n}
function cls(n){return n<0?' class="neg"':''}

function vClas(){
  var r=standings(),h='<h2 class="h2">Clasificación</h2><p class="sub">Orden: puntos, diferencia de partidas, diferencia de puntos.</p><div class="wrap"><table><thead><tr><th>#</th><th class="t">Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>Part. G</th><th>Part. P</th><th>Dif. part.</th><th>Pts. a favor</th><th>Pts. contra</th><th>Dif. pts.</th><th>Puntos</th></tr></thead><tbody>';
  r.forEach(function(x,i){
    h+='<tr'+(i<3?' class="top"':'')+'><td class="pos">'+(i+1)+'º</td><td class="t">'+esc(nm(x.id))+'</td><td>'+x.pj+'</td><td>'+x.pg+'</td><td>'+x.pp+'</td><td>'+x.gw+'</td><td>'+x.gl+'</td><td'+cls(x.cg)+'>'+sg(x.cg)+'</td><td>'+x.pf+'</td><td>'+x.pc+'</td><td'+cls(x.cp)+'>'+sg(x.cp)+'</td><td class="pts">'+x.pts+'</td></tr>';
  });
  return h+'</tbody></table></div><p class="note">Cada enfrentamiento se juega al mejor de 3 partidas; el ganador suma 3 puntos.</p>';
}

function sumTxt(j,i){
  var m=FIX[j][i],o=outcome(j,i);
  if(!o)return {t:'Pendiente',ok:false};
  if(o.a===o.b)return {t:'Revisa los marcadores',ok:false};
  var w=o.a>o.b?m[0]:m[1];
  return {t:'Gana el equipo '+w+' ('+Math.max(o.a,o.b)+'-'+Math.min(o.a,o.b)+') · '+o.fa+'-'+o.fb+' puntos',ok:true};
}
function vJor(){
  if(jsel===null){jsel=0;for(var j=0;j<9;j++){if(FIX[j].some(function(_,i){return !outcome(j,i)})){jsel=j;break}}}
  var h='<div class="jbar" role="group" aria-label="Jornada">';
  for(var j=0;j<9;j++){var full=FIX[j].every(function(_,i){return outcome(j,i)});
    h+='<button data-j="'+j+'" aria-pressed="'+(j===jsel)+'" class="'+(full?'done':'')+'" title="Jornada '+(j+1)+'">'+(j+1)+'</button>'}
  h+='</div><h2 class="h2">Jornada '+(jsel+1)+'</h2><p class="sub">'+DATES[jsel]+'</p>';
  FIX[jsel].forEach(function(m,i){
    var p=S.res[jsel+'-'+i]||[['',''],['',''],['','']],s=sumTxt(jsel,i),o=outcome(jsel,i);
    h+='<div class="match" data-i="'+i+'"><div class="mh"><span class="'+(o&&o.a>o.b?'w':'')+'">'+esc(nm(m[0]))+'</span><span class="vs">vs</span><span class="'+(o&&o.b>o.a?'w':'')+'">'+esc(nm(m[1]))+'</span></div>';
    for(var k=0;k<3;k++){var a=p[k]?p[k][0]:'',b=p[k]?p[k][1]:'';
      h+='<div class="row"><b>P'+(k+1)+'</b><input type="number" min="0" max="13" inputmode="numeric"'+RO()+' data-k="'+k+'" data-s="0" value="'+a+'" aria-label="Partida '+(k+1)+' equipo '+m[0]+'"><input type="number" min="0" max="13" inputmode="numeric"'+RO()+' data-k="'+k+'" data-s="1" value="'+b+'" aria-label="Partida '+(k+1)+' equipo '+m[1]+'"></div>'}
    h+='<div class="res'+(s.ok?' ok':'')+'">'+s.t+'</div></div>';
  });
  return h;
}
function vEq(){
  var h='<h2 class="h2">Equipos</h2><p class="sub">Edita los nombres de las parejas.</p><div class="teams">';
  Object.keys(S.teams).forEach(function(id){h+='<label>Equipo '+id+'<input type="text" data-t="'+id+'" value="'+esc(S.teams[id])+'"></label>'});
  return h+'</div>';
}
function vDat(){
  return '<h2 class="h2">Copia de seguridad</h2><p class="sub">Tus cambios se guardan como borrador en este navegador. Para publicarlos, descarga data.json y sustituye el del repositorio de GitHub.</p><div class="btns"><button class="btn" id="exp">Descargar data.json</button><button class="btn alt" id="imp">Cargar copia</button><button class="btn dng" id="rst">Volver a los datos iniciales</button></div><input type="file" id="file" accept="application/json" hidden><p class="note" id="msg"></p>';
}
var TABS=[['clas','Clasificación',vClas],['jor','Jornadas',vJor],['eq','Equipos',vEq],['dat','Datos',vDat]];
function render(){
  document.getElementById('ttl').textContent='Liga de Petanca Invernal del CDPT - Grupo '+ALL.cur;
  document.getElementById('groups').innerHTML=[1,2,3].map(function(g){return '<button class="tab g" data-g="'+g+'" aria-selected="'+(g===ALL.cur)+'">Grupo '+g+'</button>'}).join('');
  document.getElementById('st').textContent=ADMIN?'Modo administrador (borrador en este navegador). Para publicar: pestaña Datos, descarga data.json y súbelo a GitHub.':'';
  document.getElementById('tabs').innerHTML=TABS.filter(function(t){return ADMIN||t[0]==='clas'||t[0]==='jor'}).map(function(t){return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>'}).join('');
  var v=TABS.filter(function(t){return t[0]===tab})[0];
  document.getElementById('view').innerHTML=v[2]();
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}
  var g=e.target.closest('[data-g]');if(g){setGroup(+g.dataset.g);render();return}
  var j=e.target.closest('[data-j]');if(j){jsel=+j.dataset.j;render();return}
  var id=e.target.id;
  if(id==='exp'){var b=new Blob([JSON.stringify(ALL,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click()}
  if(id==='imp')document.getElementById('file').click();
  if(id==='rst'&&confirm('Se perderán los cambios y volverán los datos iniciales de los tres grupos. ¿Continuar?')){try{localStorage.removeItem(KEY)}catch(x){}ALL=load();setGroup(1);wrAll();render()}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.t){S.teams[el.dataset.t]=el.value;save();return}
  if(el.dataset.k!==undefined){
    var card=el.closest('.match'),i=+card.dataset.i,key=jsel+'-'+i;
    var p=S.res[key]||(S.res[key]=[['',''],['',''],['','']]);
    p[+el.dataset.k][+el.dataset.s]=el.value===''?'':Math.max(0,Math.min(99,parseInt(el.value,10)||0));
    save();var s=sumTxt(jsel,i),r=card.querySelector('.res');r.textContent=s.t;r.className='res'+(s.ok?' ok':'');
    var o=outcome(jsel,i),sp=card.querySelectorAll('.mh span');sp[0].className=o&&o.a>o.b?'w':'';sp[2].className=o&&o.b>o.a?'w':'';
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='file'){
    var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var o=JSON.parse(r.result);if(!o.g)throw 0;ALL=o;ALL.ver=VER;setGroup(ALL.cur||1);wrAll();render();document.getElementById('msg').textContent='Copia cargada.'}catch(x){document.getElementById('msg').textContent='El archivo no es una copia válida.'}};
    r.readAsText(f);
  }
});
(function(){
  fetch('data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(o){
    var ok=false;
    if(ADMIN){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.g){o=d;ok=true}}catch(e){}}
    if(o&&o.g){ALL=o;if(!ok)ALL.cur=1;setGroup(ALL.cur||1)}
    render();
  }).catch(function(){render()});
})();
render();
</script>
</body>
</html>
